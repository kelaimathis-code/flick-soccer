<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flick Soccer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(circle at 50% 30%,#3fe0cc 0%,#16958a 55%,#0b4a46 100%)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#game{display:block;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,25,20,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;padding:12px}
.hidden{display:none!important}
.panel{background:#fff;color:#14233a;border-radius:22px;padding:26px 28px;width:min(700px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
h1{font-size:42px;font-weight:900;letter-spacing:-1px;text-align:center;line-height:1}
h1 span{color:#0aa37f}
.sub{text-align:center;color:#5a6b80;margin:6px 0 14px}
.row{margin:12px 0}
.label{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#6a7a90;margin-bottom:7px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.teams button,.btn2{border:2px solid #dde4ee;background:#f5f8fc;border-radius:12px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer;color:#14233a;font-family:inherit}
.seg button.on,.teams button.on{border-color:#0aa37f;background:#e3f8f1}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.teams button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;font-size:12px}
.teams canvas{width:36px;height:36px}
.play{display:block;width:100%;margin-top:18px;border:0;border-radius:999px;padding:15px;font-size:22px;font-weight:900;background:#0a7cff;color:#fff;cursor:pointer;box-shadow:0 6px 0 #0657b5;font-family:inherit}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #0657b5}
.help{font-size:13px;color:#5a6b80;margin-top:14px;line-height:1.5;text-align:center}
#topbtns{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
#topbtns button{border:0;border-radius:10px;width:40px;height:40px;font-size:18px;background:rgba(255,255,255,.9);cursor:pointer}
.end{text-align:center}
.end h2{font-size:40px;font-weight:900;margin-bottom:6px}
.end .score{font-size:56px;font-weight:900;color:#0a7cff;margin:8px 0 18px}
.end .btns{display:flex;gap:10px;justify-content:center}
.end .btns .play{width:auto;padding:13px 30px;margin:0;font-size:18px}
.btn2{padding:13px 24px;font-size:18px;border-radius:999px}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="topbtns"><button id="soundBtn" title="Son">🔊</button><button id="menuBtn" title="Menu">⏸</button></div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>Flick <span>Soccer</span></h1>
    <p class="sub">Le foot de table en pichenettes · 5 contre 5</p>
    <div class="row"><div class="label">Mode</div>
      <div class="seg" id="modeSeg"><button data-v="ai" class="on">🤖 Contre l'IA</button><button data-v="2p">👥 2 joueurs</button></div></div>
    <div class="row" id="diffRow"><div class="label">Difficulté</div>
      <div class="seg" id="diffSeg"><button data-v="easy">Facile</button><button data-v="normal" class="on">Normal</button><button data-v="hard">Difficile</button></div></div>
    <div class="row"><div class="label">Buts pour gagner</div>
      <div class="seg" id="goalSeg"><button data-v="1">1</button><button data-v="3" class="on">3</button><button data-v="5">5</button></div></div>
    <div class="row"><div class="label" id="t0label">Ton équipe</div><div class="teams" id="team0"></div></div>
    <div class="row"><div class="label" id="t1label">Adversaire</div><div class="teams" id="team1"></div></div>
    <button class="play" id="playBtn">JOUER ▶</button>
    <p class="help">Clique sur un de tes palets, tire en arrière comme un lance-pierre, puis relâche.<br>Chaque équipe joue un coup à tour de rôle. Marque dans le but adverse !</p>
  </div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="panel end">
    <h2 id="endTitle">Victoire !</h2>
    <div class="score" id="endScore">3 - 1</div>
    <div class="btns"><button class="play" id="againBtn">Rejouer</button><button class="btn2" id="backBtn">Menu</button></div>
  </div>
</div>

<script>
'use strict';
// ---------- Constantes ----------
const W = 1100, H = 720;
const F = { l: 90, r: 1010, t: 130, b: 690 };     // terrain
const MY = (F.t + F.b) / 2;
const GH = 180, GY1 = MY - GH / 2, GY2 = MY + GH / 2, GD = 50; // buts
const DR = 26, BR = 12, PR = 5;                    // rayons palet / balle / poteau
const POSTS = [[F.l, GY1], [F.l, GY2], [F.r, GY1], [F.r, GY2]];
const SUB = 4, WALL_E = 0.72, BODY_E = 0.92;
const FRIC_D = 0.978, FRIC_B = 0.982, DECEL = 0.03;
const MAX_DRAG = 160, MAX_SPEED = 26, TURN_T = 15;
const BALL = 10;

const TEAMS = [
  { name: 'France',     flag: { t: 'v', c: ['#0055a4', '#ffffff', '#ef4135'] } },
  { name: 'Argentine',  flag: { t: 'h', c: ['#74acdf', '#ffffff', '#74acdf'], sun: '#f6b40e' } },
  { name: 'Brésil',     flag: { t: 'br' } },
  { name: 'Espagne',    flag: { t: 'h', c: ['#aa151b', '#f1bf00', '#f1bf00', '#aa151b'] } },
  { name: 'Allemagne',  flag: { t: 'h', c: ['#000000', '#dd0000', '#ffce00'] } },
  { name: 'Italie',     flag: { t: 'v', c: ['#009246', '#ffffff', '#ce2b37'] } },
  { name: 'Portugal',   flag: { t: 'v', c: ['#006600', '#006600', '#ff0000', '#ff0000', '#ff0000'] } },
  { name: 'Pays-Bas',   flag: { t: 'h', c: ['#ae1c28', '#ffffff', '#21468b'] } },
  { name: 'Belgique',   flag: { t: 'v', c: ['#000000', '#fdda24', '#ef3340'] } },
  { name: 'Japon',      flag: { t: 'dot', bg: '#ffffff', dot: '#bc002d' } },
  { name: 'Maroc',      flag: { t: 'star', bg: '#c1272d', star: '#006233' } },
  { name: 'Angleterre', flag: { t: 'cross', bg: '#ffffff', cross: '#ce1124' } },
];

// Formation (équipe 0, attaque vers la droite)
const FORM = [[0.05, 0.5], [0.19, 0.27], [0.19, 0.73], [0.36, 0.36], [0.36, 0.64]];

// ---------- Canvas ----------
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
function resize() {
  const s = Math.min(innerWidth * 0.98 / W, innerHeight * 0.98 / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize); resize();

function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawFlag(c, f, x, y, w, h) {
  const cx = x + w / 2, cy = y + h / 2;
  if (f.t === 'v') { const n = f.c.length; f.c.forEach((col, i) => { c.fillStyle = col; c.fillRect(x + w * i / n, y, w / n + 0.6, h); }); }
  else if (f.t === 'h') { const n = f.c.length; f.c.forEach((col, i) => { c.fillStyle = col; c.fillRect(x, y + h * i / n, w, h / n + 0.6); }); }
  else if (f.t === 'dot') { c.fillStyle = f.bg; c.fillRect(x, y, w, h); c.fillStyle = f.dot; circle(c, cx, cy, h * 0.3); }
  else if (f.t === 'cross') { c.fillStyle = f.bg; c.fillRect(x, y, w, h); c.fillStyle = f.cross; c.fillRect(cx - h * 0.1, y, h * 0.2, h); c.fillRect(x, cy - h * 0.1, w, h * 0.2); }
  else if (f.t === 'star') {
    c.fillStyle = f.bg; c.fillRect(x, y, w, h);
    c.strokeStyle = f.star; c.lineWidth = h * 0.07; c.beginPath();
    for (let i = 0; i <= 5; i++) { const a = -Math.PI / 2 + i * 4 * Math.PI / 5; const px = cx + Math.cos(a) * h * 0.3, py = cy + Math.sin(a) * h * 0.3; i ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.closePath(); c.stroke();
  }
  else if (f.t === 'br') {
    c.fillStyle = '#009c3b'; c.fillRect(x, y, w, h);
    c.fillStyle = '#ffdf00'; c.beginPath(); c.moveTo(cx, y + h * 0.08); c.lineTo(x + w * 0.94, cy); c.lineTo(cx, y + h * 0.92); c.lineTo(x + w * 0.06, cy); c.closePath(); c.fill();
    c.fillStyle = '#002776'; circle(c, cx, cy, h * 0.24);
  }
  if (f.sun) { c.fillStyle = f.sun; circle(c, cx, cy, h * 0.12); }
}

function makeDisc(teamIdx, side) {
  const S = 3, pad = 6, size = (DR + pad) * 2;
  const c = document.createElement('canvas'); c.width = c.height = size * S;
  const x = c.getContext('2d'); x.scale(S, S);
  const cx = DR + pad;
  const rim = side === 0 ? ['#ffffff', '#8e9bb0'] : ['#ffe27a', '#c08400'];
  let g = x.createRadialGradient(cx - 9, cx - 9, 3, cx, cx, DR);
  g.addColorStop(0, rim[0]); g.addColorStop(1, rim[1]);
  x.fillStyle = g; circle(x, cx, cx, DR);
  x.lineWidth = 2; x.strokeStyle = 'rgba(0,0,0,.55)'; x.stroke();
  x.fillStyle = '#1b2433'; circle(x, cx, cx, DR - 6);
  const ir = DR - 9;
  x.save(); x.beginPath(); x.arc(cx, cx, ir, 0, Math.PI * 2); x.clip();
  drawFlag(x, TEAMS[teamIdx].flag, cx - ir * 1.3, cx - ir, ir * 2.6, ir * 2);
  x.restore();
  g = x.createLinearGradient(0, cx - DR, 0, cx + 2);
  g.addColorStop(0, 'rgba(255,255,255,.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.beginPath(); x.ellipse(cx, cx - DR * 0.42, DR * 0.62, DR * 0.36, 0, 0, Math.PI * 2); x.fill();
  return c;
}

function flagBadge(teamIdx, px) {
  const c = document.createElement('canvas'); c.width = c.height = px;
  const x = c.getContext('2d'), r = px / 2;
  x.save(); x.beginPath(); x.arc(r, r, r - 2, 0, Math.PI * 2); x.clip();
  drawFlag(x, TEAMS[teamIdx].flag, -r * 0.3, 0, px * 1.3, px); x.restore();
  x.lineWidth = 3; x.strokeStyle = 'rgba(0,0,0,.25)'; x.beginPath(); x.arc(r, r, r - 2, 0, Math.PI * 2); x.stroke();
  return c;
}

// ---------- Son ----------
let AC = null, muted = false, lastHit = 0;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function noise(dur, vol, freq, q) {
  if (muted) return; const a = ac(); const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function tone(freq, dur, type, vol, delay = 0) {
  if (muted) return; const a = ac(), t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
}
function hitSound(v) { const now = performance.now(); if (now - lastHit < 35) return; lastHit = now; noise(0.06, Math.min(0.9, v / 14), 1800, 2); }
function whistle() {
  if (muted) return; const a = ac(), t = a.currentTime;
  const o = a.createOscillator(), l = a.createOscillator(), lg = a.createGain(), g = a.createGain();
  o.type = 'square'; o.frequency.value = 2600; l.frequency.value = 28; lg.gain.value = 120;
  l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0, t); g.gain.linearRampToValueAtTime(0.06, t + 0.02); g.gain.setValueAtTime(0.06, t + 0.32); g.gain.linearRampToValueAtTime(0, t + 0.4);
  o.connect(g); g.connect(a.destination); o.start(t); l.start(t); o.stop(t + 0.42); l.stop(t + 0.42);
}
function goalSound() { noise(1.6, 0.5, 900, 0.6); [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.35, 'triangle', 0.18, i * 0.11)); }

// ---------- Physique ----------
function walls(b, hits) {
  const r = b.r;
  // poteaux
  for (const p of POSTS) {
    const dx = b.x - p[0], dy = b.y - p[1], d2 = dx * dx + dy * dy, m = r + PR;
    if (d2 < m * m && d2 > 0) {
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      b.x = p[0] + nx * m; b.y = p[1] + ny * m;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) { b.vx -= (1 + WALL_E) * vn * nx; b.vy -= (1 + WALL_E) * vn * ny; hits && hits.push(-vn); }
    }
  }
  // intérieur des buts
  if (b.x < F.l) {
    if (b.x - r < F.l - GD) { b.x = F.l - GD + r; if (b.vx < 0) { b.vx = -b.vx * WALL_E * 0.5; } }
    if (b.x < F.l - r) {
      if (b.y - r < GY1) { b.y = GY1 + r; if (b.vy < 0) b.vy = -b.vy * WALL_E * 0.5; }
      if (b.y + r > GY2) { b.y = GY2 - r; if (b.vy > 0) b.vy = -b.vy * WALL_E * 0.5; }
    }
  } else if (b.x > F.r) {
    if (b.x + r > F.r + GD) { b.x = F.r + GD - r; if (b.vx > 0) { b.vx = -b.vx * WALL_E * 0.5; } }
    if (b.x > F.r + r) {
      if (b.y - r < GY1) { b.y = GY1 + r; if (b.vy < 0) b.vy = -b.vy * WALL_E * 0.5; }
      if (b.y + r > GY2) { b.y = GY2 - r; if (b.vy > 0) b.vy = -b.vy * WALL_E * 0.5; }
    }
  }
  // bords du terrain
  if (b.y < GY1 || b.y > GY2) {
    if (b.x - r < F.l) { b.x = F.l + r; if (b.vx < 0) { b.vx = -b.vx * WALL_E; hits && hits.push(-b.vx); } }
    if (b.x + r > F.r) { b.x = F.r - r; if (b.vx > 0) { b.vx = -b.vx * WALL_E; hits && hits.push(b.vx); } }
  }
  if (b.y - r < F.t) { b.y = F.t + r; if (b.vy < 0) { b.vy = -b.vy * WALL_E; hits && hits.push(-b.vy); } }
  if (b.y + r > F.b) { b.y = F.b - r; if (b.vy > 0) { b.vy = -b.vy * WALL_E; hits && hits.push(b.vy); } }
}

function stepWorld(bs, hits) {
  const n = bs.length;
  for (let s = 0; s < SUB; s++) {
    for (let i = 0; i < n; i++) { const b = bs[i]; if (b.vx || b.vy) { b.x += b.vx / SUB; b.y += b.vy / SUB; } walls(b, hits); }
    for (let i = 0; i < n; i++) {
      const a = bs[i];
      for (let j = i + 1; j < n; j++) {
        const b = bs[j], dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r, d2 = dx * dx + dy * dy;
        if (d2 >= min * min || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = min - d;
        const ia = 1 / a.m, ib = 1 / b.m, it = ia + ib;
        a.x -= nx * ov * ia / it; a.y -= ny * ov * ia / it; b.x += nx * ov * ib / it; b.y += ny * ov * ib / it;
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) {
          const jm = -(1 + BODY_E) * vn / it;
          a.vx -= jm * nx * ia; a.vy -= jm * ny * ia; b.vx += jm * nx * ib; b.vy += jm * ny * ib;
          hits && hits.push(-vn);
        }
      }
    }
  }
  let moving = false;
  for (const b of bs) {
    if (!b.vx && !b.vy) continue;
    const sp = Math.hypot(b.vx, b.vy), ns = sp * (b.ball ? FRIC_B : FRIC_D) - DECEL;
    if (ns <= 0) { b.vx = 0; b.vy = 0; } else { b.vx *= ns / sp; b.vy *= ns / sp; moving = true; }
  }
  return moving;
}

function checkGoal(bs) {
  const b = bs[BALL];
  if (b.x < F.l - BR) return 1;   // but dans le but gauche → équipe 1 marque
  if (b.x > F.r + BR) return 0;   // but dans le but droit → équipe 0 marque
  return -1;
}

function cloneBodies(bs) { return bs.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, m: b.m, team: b.team, ball: b.ball })); }

function simulate(bs, idx, ang, p, maxFrames = 420) {
  const s = cloneBodies(bs), d = s[idx];
  d.vx = Math.cos(ang) * p * MAX_SPEED; d.vy = Math.sin(ang) * p * MAX_SPEED;
  for (let f = 0; f < maxFrames; f++) {
    const mv = stepWorld(s, null);
    const g = checkGoal(s);
    if (g >= 0) return { goal: g, bodies: s };
    if (!mv) break;
  }
  return { goal: -1, bodies: s };
}

// ---------- IA ----------
function shotCandidates(bs, t, powers, spreads) {
  const ball = bs[BALL], dir = t === 0 ? 1 : -1, tx = (t === 0 ? F.r : F.l) + dir * 25;
  const aims = [[tx, MY], [tx, GY1 + 35], [tx, GY2 - 35], [tx, 2 * F.t - MY], [tx, 2 * F.b - MY]];
  const out = [];
  for (let i = 0; i < bs.length; i++) {
    const d = bs[i]; if (d.team !== t) continue;
    for (const a of aims) {
      const ux = a[0] - ball.x, uy = a[1] - ball.y, ul = Math.hypot(ux, uy) || 1;
      const gx = ball.x - ux / ul * (DR + BR), gy = ball.y - uy / ul * (DR + BR);
      const vx = gx - d.x, vy = gy - d.y, vl = Math.hypot(vx, vy) || 1;
      if ((vx * ux + vy * uy) / (vl * ul) < 0.1) continue; // angle de coupe impossible
      const ang = Math.atan2(vy, vx);
      for (const da of spreads) for (const p of powers) out.push({ i, ang: ang + da, p });
    }
    const a0 = Math.atan2(ball.y - d.y, ball.x - d.x);
    for (const p of powers) out.push({ i, ang: a0, p });
  }
  return out;
}

function evaluate(bs, t) {
  const ball = bs[BALL], tgX = t === 0 ? F.r : F.l, ownX = t === 0 ? F.l : F.r;
  let s = -Math.hypot(ball.x - tgX, ball.y - MY);
  s += Math.hypot(ball.x - ownX, ball.y - MY) * 0.6;
  let gk = Infinity;
  for (const b of bs) {
    if (b.team !== t) continue;
    if ((t === 0 && b.x < ball.x) || (t === 1 && b.x > ball.x)) s += 22;
    gk = Math.min(gk, Math.hypot(b.x - ownX, b.y - MY));
  }
  s -= gk * 0.15;
  return s;
}

function opponentThreat(bs, opp) {
  const c = shotCandidates(bs, opp, [0.8, 1], [0]);
  for (const k of c) if (simulate(bs, k.i, k.ang, k.p, 300).goal === opp) return true;
  return false;
}

function aiChoose(t, diff) {
  const bs = G.bodies;
  const cands = shotCandidates(bs, t, [0.5, 0.75, 1], [-0.05, 0, 0.05]);
  for (let k = 0; k < 20; k++) { const idx = t * 5 + Math.floor(Math.random() * 5); cands.push({ i: idx, ang: Math.random() * Math.PI * 2, p: 0.4 + Math.random() * 0.6 }); }
  for (const c of cands) {
    const r = simulate(bs, c.i, c.ang, c.p);
    c.res = r;
    c.score = r.goal === t ? 10000 + c.p * 10 : r.goal === 1 - t ? -10000 : evaluate(r.bodies, t);
  }
  cands.sort((a, b) => b.score - a.score);
  if (diff === 'hard') {
    for (const c of cands.slice(0, 6)) if (c.res.goal === -1 && opponentThreat(c.res.bodies, 1 - t)) c.score -= 3000;
    cands.sort((a, b) => b.score - a.score);
  }
  const cfg = { easy: [8, 0.09], normal: [2, 0.025], hard: [1, 0.006] }[diff];
  const pick = cands[Math.floor(Math.random() * Math.min(cfg[0], cands.length))];
  return { i: pick.i, ang: pick.ang + (Math.random() * 2 - 1) * cfg[1], p: pick.p };
}

// ---------- État du jeu ----------
const G = {
  mode: 'ai', diff: 'normal', target: 3, teams: [1, 0], score: [0, 0], bodies: [], turn: 0,
  phase: 'menu', timeLeft: TURN_T, drag: null, msg: null, sprites: [], moveFrames: 0, goalTimer: 0,
  kick: 0, match: 0, hover: null, ballRot: 0, time: 0, badges: [],
};
const isAI = t => G.mode === 'ai' && t === 1;

function resetPositions() {
  const bs = [];
  for (let t = 0; t < 2; t++) for (const [fx, fy] of FORM) {
    const x = t === 0 ? F.l + fx * (F.r - F.l) : F.r - fx * (F.r - F.l);
    bs.push({ x, y: F.t + fy * (F.b - F.t), vx: 0, vy: 0, r: DR, m: 1, team: t, ball: false });
  }
  bs.push({ x: W / 2, y: MY, vx: 0, vy: 0, r: BR, m: 0.45, team: -1, ball: true });
  G.bodies = bs;
}

function say(text, frames = 90, big = false) { G.msg = { text, t: frames, max: frames, big }; }

function startMatch() {
  G.score = [0, 0]; G.match++;
  G.sprites = [makeDisc(G.teams[0], 0), makeDisc(G.teams[1], 1)];
  G.badges = [flagBadge(G.teams[0], 160), flagBadge(G.teams[1], 160)];
  resetPositions(); G.turn = 0;
  hide('menu'); hide('endScreen');
  whistle(); say('Coup d\'envoi !', 80); startTurn();
}

function startTurn() {
  G.drag = null; G.timeLeft = TURN_T; G.moveFrames = 0;
  if (isAI(G.turn)) {
    G.phase = 'ai';
    const m = G.match;
    setTimeout(() => {
      if (m !== G.match || G.phase !== 'ai') return;
      const c = aiChoose(G.turn, G.diff);
      shoot(G.bodies[c.i], c.ang, c.p);
    }, 700);
  } else G.phase = 'aim';
}

function nextTurn() { G.turn = 1 - G.turn; startTurn(); }

function shoot(b, ang, p) {
  b.vx = Math.cos(ang) * p * MAX_SPEED; b.vy = Math.sin(ang) * p * MAX_SPEED;
  G.phase = 'moving'; G.moveFrames = 0; G.drag = null;
  noise(0.08, 0.4 + p * 0.4, 600, 1);
}

function onGoal(team) {
  G.score[team]++; G.phase = 'goal'; G.goalTimer = 130; G.kick = 1 - team;
  say('BUT !', 130, true); goalSound();
}

function afterGoal() {
  if (G.score[0] >= G.target || G.score[1] >= G.target) return endMatch();
  resetPositions(); G.turn = G.kick; whistle(); startTurn();
}

function endMatch() {
  G.phase = 'over';
  const w = G.score[0] > G.score[1] ? 0 : 1;
  document.getElementById('endTitle').textContent =
    G.mode === 'ai' ? (w === 0 ? 'Victoire ! 🏆' : 'Défaite 😢') : `${TEAMS[G.teams[w]].name} gagne ! 🏆`;
  document.getElementById('endScore').textContent = `${G.score[0]} - ${G.score[1]}`;
  show('endScreen');
  if (w === 0 || G.mode === '2p') [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.4, 'triangle', 0.16, i * 0.12));
  else [392, 330, 262].forEach((f, i) => tone(f, 0.45, 'sine', 0.16, i * 0.2));
}

// ---------- Boucle ----------
function update() {
  G.time++;
  if (G.msg && --G.msg.t <= 0) G.msg = null;
  if (G.phase === 'moving' || G.phase === 'goal') {
    const hits = [], mv = stepWorld(G.bodies, hits);
    if (hits.length) hitSound(Math.max(...hits));
    const b = G.bodies[BALL]; G.ballRot += Math.hypot(b.vx, b.vy) / BR * Math.sign(b.vx || 1);
    if (G.phase === 'moving') {
      const g = checkGoal(G.bodies);
      if (g >= 0) return onGoal(g);
      if (!mv || ++G.moveFrames > 60 * 15) nextTurn();
    } else if (--G.goalTimer <= 0) afterGoal();
  } else if (G.phase === 'aim') {
    G.timeLeft -= 1 / 60;
    if (G.timeLeft <= 0) { say('Temps écoulé !', 70); nextTurn(); }
  }
}

function drawField() {
  // fond
  ctx.fillStyle = '#0d3b2a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#226b34'; roundRect(ctx, F.l - GD - 18, F.t - 16, F.r - F.l + 2 * GD + 36, F.b - F.t + 32, 12); ctx.fill();
  // bandes de gazon
  const n = 12, sw = (F.r - F.l) / n;
  for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? '#3a9a46' : '#43a94f'; ctx.fillRect(F.l + i * sw, F.t, sw + 1, F.b - F.t); }
  // lignes
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
  ctx.strokeRect(F.l, F.t, F.r - F.l, F.b - F.t);
  ctx.beginPath(); ctx.moveTo(W / 2, F.t); ctx.lineTo(W / 2, F.b); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, MY, 80, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#fff'; circle(ctx, W / 2, MY, 5);
  for (const side of [0, 1]) {
    const x0 = side ? F.r : F.l, dir = side ? -1 : 1;
    ctx.strokeRect(Math.min(x0, x0 + dir * 150), MY - 170, 150, 340);
    ctx.strokeRect(Math.min(x0, x0 + dir * 55), MY - 110, 55, 220);
    circle(ctx, x0 + dir * 110, MY, 4);
    ctx.beginPath(); ctx.arc(x0 + dir * 110, MY, 70, side ? Math.PI - 0.93 : -0.93, side ? Math.PI + 0.93 : 0.93); ctx.stroke();
    // coins
    for (const cy of [F.t, F.b]) { ctx.beginPath(); ctx.arc(x0, cy, 14, cy === F.t ? (side ? Math.PI / 2 : 0) : (side ? Math.PI : -Math.PI / 2), cy === F.t ? (side ? Math.PI : Math.PI / 2) : (side ? Math.PI * 1.5 : 0)); ctx.stroke(); }
  }
  // buts
  for (const side of [0, 1]) {
    const gx = side ? F.r : F.l - GD;
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(gx, GY1, GD, GH);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = gx; x <= gx + GD; x += 10) { ctx.moveTo(x, GY1); ctx.lineTo(x, GY2); }
    for (let y = GY1; y <= GY2; y += 10) { ctx.moveTo(gx, y); ctx.lineTo(gx + GD, y); }
    ctx.stroke();
    ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.beginPath();
    const x0 = side ? F.r : F.l, xb = side ? F.r + GD : F.l - GD;
    ctx.moveTo(x0, GY1); ctx.lineTo(xb, GY1); ctx.lineTo(xb, GY2); ctx.lineTo(x0, GY2); ctx.stroke();
    ctx.fillStyle = '#fff'; circle(ctx, x0, GY1, PR + 1); circle(ctx, x0, GY2, PR + 1);
  }
}

function drawBall(b) {
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(b.x + 3, b.y + 4, BR, BR * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(G.ballRot * 0.15);
  const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, BR); g.addColorStop(0, '#fff'); g.addColorStop(1, '#cfd5dc');
  ctx.fillStyle = g; circle(ctx, 0, 0, BR);
  ctx.fillStyle = '#1d2330';
  const pent = (cx, cy, r) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } ctx.fill(); };
  pent(0, 0, 4.5);
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.clip();
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5 + Math.PI / 5; pent(Math.cos(a) * 11, Math.sin(a) * 11, 4); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawBodies() {
  const canAim = G.phase === 'aim';
  const pulse = 0.5 + 0.5 * Math.sin(G.time * 0.12);
  for (const b of G.bodies) {
    if (b.ball) continue;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(b.x + 4, b.y + 6, DR, DR * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    if (canAim && b.team === G.turn) {
      ctx.strokeStyle = `rgba(255,255,255,${0.35 + pulse * 0.5})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, DR + 5 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
    }
    if ((G.drag && G.drag.b === b) || (canAim && G.hover === b)) {
      ctx.fillStyle = 'rgba(255,255,120,.35)'; circle(ctx, b.x, b.y, DR + 9);
    }
    const sp = G.sprites[b.team], s = (DR + 6) * 2;
    ctx.drawImage(sp, b.x - s / 2, b.y - s / 2, s, s);
  }
  drawBall(G.bodies[BALL]);
}

function drawAim() {
  const d = G.drag; if (!d) return;
  const b = d.b, dx = b.x - d.x, dy = b.y - d.y, len = Math.hypot(dx, dy);
  if (len < 8) return;
  const p = Math.min(len, MAX_DRAG) / MAX_DRAG, nx = dx / len, ny = dy / len;
  // élastique
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - nx * p * MAX_DRAG, b.y - ny * p * MAX_DRAG); ctx.stroke(); ctx.setLineDash([]);
  // flèche
  const col = `hsl(${120 - p * 120},90%,55%)`, L = DR + 20 + p * 170;
  const ex = b.x + nx * L, ey = b.y + ny * L;
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(b.x + nx * (DR + 4), b.y + ny * (DR + 4)); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(b.x + nx * (DR + 4), b.y + ny * (DR + 4)); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(ex + nx * 18, ey + ny * 18); ctx.lineTo(ex - ny * 13, ey + nx * 13); ctx.lineTo(ex + ny * 13, ey - nx * 13); ctx.closePath(); ctx.fill();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(Math.round(p * 100) + '%', b.x, b.y - DR - 14);
}

function drawHUD() {
  const g = ctx.createLinearGradient(0, 10, 0, 112); g.addColorStop(0, '#1a4f8f'); g.addColorStop(1, '#0c2850');
  ctx.fillStyle = g; roundRect(ctx, 10, 10, W - 20, 104, 16); ctx.fill();
  const names = [TEAMS[G.teams[0]].name, TEAMS[G.teams[1]].name];
  const labels = G.mode === 'ai' ? ['Toi', 'IA ' + { easy: 'facile', normal: 'normale', hard: 'difficile' }[G.diff]] : ['Joueur 1', 'Joueur 2'];
  ctx.textBaseline = 'middle';
  for (const t of [0, 1]) {
    const bx = t ? W - 66 : 66;
    if (G.badges[t]) ctx.drawImage(G.badges[t], bx - 38, 24, 76, 76);
    if (G.turn === t && G.phase !== 'goal') { ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, 62, 42, 0, Math.PI * 2); ctx.stroke(); }
    ctx.textAlign = t ? 'right' : 'left';
    const tx = t ? W - 120 : 120;
    ctx.fillStyle = '#fff'; ctx.font = '900 30px system-ui,sans-serif'; ctx.fillText(names[t], tx, 48);
    ctx.fillStyle = t ? '#ffd23f' : '#dfe8f5'; ctx.font = '700 18px system-ui,sans-serif'; ctx.fillText(labels[t], tx, 82);
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 52px system-ui,sans-serif';
  ctx.fillText(G.score[0], W / 2 - 55, 52); ctx.fillText(G.score[1], W / 2 + 55, 52);
  ctx.font = '900 34px system-ui,sans-serif'; ctx.fillText('-', W / 2, 50);
  let txt = '';
  if (G.phase === 'aim') txt = G.mode === 'ai' ? 'À toi de jouer' : `Au tour de ${labels[G.turn]}`;
  else if (G.phase === 'ai') txt = 'L\'IA réfléchit…';
  else if (G.phase === 'moving') txt = G.mode === 'ai' && G.turn === 1 ? 'L\'IA joue' : '…';
  else if (G.phase === 'goal') txt = 'BUT !';
  ctx.font = '800 19px system-ui,sans-serif'; ctx.fillStyle = '#ffe14d'; ctx.fillText(txt, W / 2, 86);
  if (G.phase === 'aim') {
    const p = Math.max(0, G.timeLeft / TURN_T), bw = 200;
    ctx.fillStyle = 'rgba(255,255,255,.2)'; roundRect(ctx, W / 2 - bw / 2, 100, bw, 7, 4); ctx.fill();
    ctx.fillStyle = p > 0.33 ? '#4ade80' : '#f87171'; roundRect(ctx, W / 2 - bw / 2, 100, bw * p, 7, 4); ctx.fill();
  }
  ctx.textBaseline = 'alphabetic';
}

function drawMsg() {
  const m = G.msg; if (!m) return;
  const k = 1 - m.t / m.max, a = Math.min(1, m.t / 20, (m.max - m.t) / 8 + 0.01);
  const sc = m.big ? 1 + Math.sin(Math.min(1, k * 4) * Math.PI) * 0.25 : 1;
  ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(W / 2, MY); ctx.scale(sc, sc);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 ${m.big ? 130 : 54}px system-ui,sans-serif`;
  ctx.lineWidth = m.big ? 14 : 9; ctx.strokeStyle = '#0c2850'; ctx.strokeText(m.text, 0, 0);
  ctx.fillStyle = m.big ? '#ffe14d' : '#fff'; ctx.fillText(m.text, 0, 0);
  ctx.restore();
}

function draw() {
  drawField();
  if (G.bodies.length) { drawBodies(); drawAim(); }
  drawHUD(); drawMsg();
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(frame);
}

// ---------- Entrées ----------
function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function pickDisc(p) {
  let best = null, bd = DR + 16;
  for (const b of G.bodies) { if (b.ball || b.team !== G.turn) continue; const d = Math.hypot(b.x - p.x, b.y - p.y); if (d < bd) { bd = d; best = b; } }
  return best;
}
cv.addEventListener('pointerdown', e => {
  if (G.phase !== 'aim') return; ac();
  const p = toWorld(e), b = pickDisc(p);
  if (!b) return;
  G.drag = { b, x: p.x, y: p.y }; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  const p = toWorld(e);
  if (G.drag) { G.drag.x = p.x; G.drag.y = p.y; return; }
  G.hover = G.phase === 'aim' ? pickDisc(p) : null;
  cv.style.cursor = G.hover ? 'grab' : 'default';
});
function release(e) {
  const d = G.drag; if (!d || G.phase !== 'aim') { G.drag = null; return; }
  const p = toWorld(e), dx = d.b.x - p.x, dy = d.b.y - p.y, len = Math.hypot(dx, dy);
  G.drag = null;
  if (len < 14) return;
  shoot(d.b, Math.atan2(dy, dx), Math.min(len, MAX_DRAG) / MAX_DRAG);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { G.drag = null; });

// ---------- Menu ----------
const $ = id => document.getElementById(id);
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function seg(id, cb) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset.v);
  });
}
seg('modeSeg', v => {
  G.mode = v; $('diffRow').classList.toggle('hidden', v !== 'ai');
  $('t0label').textContent = v === 'ai' ? 'Ton équipe' : 'Joueur 1';
  $('t1label').textContent = v === 'ai' ? 'Adversaire' : 'Joueur 2';
});
seg('diffSeg', v => G.diff = v);
seg('goalSeg', v => G.target = +v);
function buildTeams(side) {
  const el = $('team' + side); el.innerHTML = '';
  TEAMS.forEach((t, i) => {
    const b = document.createElement('button'); b.className = G.teams[side] === i ? 'on' : '';
    b.appendChild(flagBadge(i, 72)); b.appendChild(document.createTextNode(t.name));
    b.onclick = () => {
      G.teams[side] = i;
      if (G.teams[1 - side] === i) G.teams[1 - side] = (i + 1) % TEAMS.length;
      buildTeams(0); buildTeams(1);
    };
    el.appendChild(b);
  });
}
buildTeams(0); buildTeams(1);
$('playBtn').onclick = () => { ac(); startMatch(); };
$('againBtn').onclick = () => startMatch();
$('backBtn').onclick = () => { hide('endScreen'); show('menu'); G.phase = 'menu'; };
$('menuBtn').onclick = () => { G.match++; G.phase = 'menu'; G.drag = null; hide('endScreen'); show('menu'); };
$('soundBtn').onclick = () => { muted = !muted; $('soundBtn').textContent = muted ? '🔇' : '🔊'; };

resetPositions();
G.sprites = [makeDisc(G.teams[0], 0), makeDisc(G.teams[1], 1)];
G.badges = [flagBadge(G.teams[0], 160), flagBadge(G.teams[1], 160)];
requestAnimationFrame(frame);
</script>
